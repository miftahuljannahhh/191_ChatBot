<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="chat" aria-label="Jendela percakapan chatbot">

    <header class="chat__header">
      <div class="mascot" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="44" height="44">
          <line x1="32" y1="8" x2="32" y2="16" stroke="#2B3050" stroke-width="3" stroke-linecap="round"/>
          <circle cx="32" cy="7" r="4" fill="#FFB38A"/>
          <rect x="8" y="16" width="48" height="40" rx="16" fill="#FFFFFF" stroke="#2B3050" stroke-width="3"/>
          <g class="mascot__eyes">
            <ellipse cx="23" cy="34" rx="4" ry="5" fill="#2B3050"/>
            <ellipse cx="41" cy="34" rx="4" ry="5" fill="#2B3050"/>
          </g>
          <circle cx="16" cy="43" r="3.5" fill="#FFC9A8"/>
          <circle cx="48" cy="43" r="3.5" fill="#FFC9A8"/>
          <path d="M26 44 Q32 50 38 44" fill="none" stroke="#2B3050" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="chat__title">
        <h1>Chatbot</h1>
        <p><span class="dot"></span> Siap membantu Anda</p>
      </div>
    </header>

    <section id="messages" class="chat__messages" aria-live="polite"></section>

    <form id="chat-form" class="chat__form" autocomplete="off">
      <input id="message-input" type="text" placeholder="Ketik pesan..." aria-label="Ketik pesan" maxlength="1000" />
      <button id="send-button" type="submit">Kirim</button>
    </form>

  </main>

  <script src="script.js"></script>
</body>
</html>
